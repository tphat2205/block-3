<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đặt hàng | REST và gRPC</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 620px; margin: 48px auto; padding: 0 20px; color: #182230; }
    label { display: block; margin: 16px 0 6px; }
    input, button { font: inherit; padding: 9px 11px; }
    input { width: 100%; box-sizing: border-box; }
    button { margin-top: 18px; cursor: pointer; }
    pre { padding: 14px; background: #f2f4f7; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Đặt hàng</h1>
  <p>Browser gọi REST <code>POST /orders</code>. Order API chuyển lời gọi Inventory qua REST baseline hoặc gRPC.</p>
  <form id="order-form">
    <label for="sku">SKU</label>
    <select id="sku" name="sku">
      <option>SKU-AVAILABLE</option>
      <option>SKU-LIMITED</option>
    </select>
    <label for="quantity">Số lượng</label>
    <input id="quantity" name="quantity" type="number" min="1" value="2" required>
    <button type="submit">Tạo đơn</button>
  </form>
  <pre id="result" aria-live="polite">Kết quả sẽ hiện ở đây.</pre>
  <script>
    document.querySelector('#order-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const result = document.querySelector('#result');
      try {
        const response = await fetch('/orders', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ sku: form.get('sku'), quantity: Number(form.get('quantity')) })
        });
        result.textContent = `HTTP ${response.status}\n${JSON.stringify(await response.json(), null, 2)}`;
      } catch (error) {
        result.textContent = error.message;
      }
    });
  </script>
</body>
</html>
